<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift Vendas+</title>
    <link rel="stylesheet" href="../css/conquistas.css" />
    <link
      href="https://cdn.boxicons.com/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Menu Lateral -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img
            class="img-logo"
            src="/images/logo_swift+venda+_branca-transp-cort.png"
            alt="Swift Venda+"
          />
        </div>
        <button class="sidebar-toggle" id="sidebarToggle">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon"
            ><i class="bx-grid-circle-diagonal-right"></i>
          </span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="ranking.html" class="nav-item">
          <span class="nav-icon"><i class="bx-trophy-star"></i> </span>
          <span class="nav-text">Ranking</span>
        </a>
        <a href="missoes.html" class="nav-item">
          <span class="nav-icon"><i class="bx-bullseye"></i> </span>
          <span class="nav-text">Missões</span>
        </a>
        <a href="conquistas.html" class="nav-item active">
          <span class="nav-icon"><i class="bx-medal-star-alt"></i> </span>
          <span class="nav-text">Conquistas</span>
        </a>
        <a href="cursos.html" class="nav-item">
          <span class="nav-icon"><i class="bx-book-bookmark"></i> </span>
          <span class="nav-text">Cursos</span>
        </a>
        <a href="configuracoes.html" class="nav-item">
          <span class="nav-icon"><i class="bx-cog"></i> </span>
          <span class="nav-text">Configurações</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">JS</div>
          <div class="user-details">
            <div class="user-name">João Silva</div>
            <div class="user-role">Vendedor</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">
          <span>🚪</span>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content" id="mainContent">
      <!-- Header -->
      <header class="page-header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle">☰</button>
          <h1 class="page-title">
            <span class="title-icon"><i class="bx-medal-star-alt"></i></span>
            Conquistas
          </h1>
        </div>
        <div class="header-right">
          <div class="achievements-summary">
            <span class="summary-item">
              <span class="summary-number" id="unlockedCount">8</span>
              <span class="summary-text">Desbloqueadas</span>
            </span>
            <span class="summary-divider">|</span>
            <span class="summary-item">
              <span class="summary-number" id="totalCount">15</span>
              <span class="summary-text">Total</span>
            </span>
          </div>
        </div>
      </header>

      <!-- Filtros -->
      <section class="filters-section">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">
            <span>🏆</span>
            Todas
          </button>
          <button class="filter-tab" data-filter="unlocked">
            <span>✅</span>
            Desbloqueadas
          </button>
          <button class="filter-tab" data-filter="locked">
            <span>🔒</span>
            Bloqueadas
          </button>
          <button class="filter-tab" data-filter="recent">
            <span>⭐</span>
            Recentes
          </button>
        </div>

        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar conquistas..."
          />
          <span class="search-icon">🔍</span>
        </div>
      </section>

      <!-- Progress Bar -->
      <section class="progress-section">
        <div class="progress-card">
          <div class="progress-header">
            <h3>Progresso Geral</h3>
            <span class="progress-percentage" id="progressPercentage">53%</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar">
              <div
                class="progress-fill"
                id="progressFill"
                style="width: 53%"
              ></div>
            </div>
          </div>
          <div class="progress-details">
            <span>8 de 15 conquistas desbloqueadas</span>
          </div>
        </div>
      </section>

      <!-- Conquistas Grid -->
      <section class="achievements-section">
        <div class="achievements-grid" id="achievementsGrid">
          <!-- Conquistas serão carregadas via JavaScript -->
        </div>
      </section>

      <!-- Modal de Detalhes -->
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
          <button class="modal-close" id="modalClose">×</button>
          <div class="modal-header">
            <div class="modal-icon" id="modalIcon">🏆</div>
            <h2 class="modal-title" id="modalTitle">Título da Conquista</h2>
          </div>
          <div class="modal-body">
            <div class="modal-description" id="modalDescription">
              Descrição da conquista...
            </div>
            <div class="modal-requirements" id="modalRequirements">
              <h4>Requisitos:</h4>
              <ul id="requirementsList"></ul>
            </div>
            <div class="modal-reward" id="modalReward">
              <h4>Recompensa:</h4>
              <span class="reward-points">+100 pontos</span>
            </div>
            <div class="modal-date" id="modalDate"></div>
          </div>
        </div>
      </div>
    </main>
    <script src="../js/conquistas.js"></script>
  </body>
</html>
